apply plugin: 'com.android.application'

// Firma de release: lee credenciales desde android/keystore.properties (gitignored,
// NUNCA en el repo). Si el archivo no existe (ej. máquina sin el keystore), el
// build de release sigue funcionando sin firmar — sólo `bundleRelease` para Play
// requiere la firma. Ver docs/ANDROID_RELEASE.md §4.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "com.avfinance.alyto"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.avfinance.alyto"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 1 a 8 ya consumidos en Play. Publicadas: 5 (18-oct), 7 (22-oct) y 8
        // (23-oct). La 6 nunca se subio. La 7 salio sin Firebase. La 8 llevaba
        // Firebase pero se subio minutos ANTES del arreglo del `then()`, asi que
        // el push seguia colgado. La 9 es la primera con la cadena completa,
        // probada en un dispositivo real.
        versionCode 9
        versionName "2.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Firma con la upload key sólo si keystore.properties está presente.
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            // R8/minify desactivado en el primer release (sin validar contra el
            // WebView+plugins). Activar tras probar un AAB minificado e2e.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// El plugin de Google Services SOLO se aplica si existe android/app/google-services.json.
// Sin el archivo el push nativo (FCM) NO funciona: el binario sale sin `google_app_id`,
// FirebaseMessaging no puede inicializarse y la llamada de registro del plugin de push
// se queda colgada para siempre, sin resolver ni fallar. En la app se ve como un
// interruptor que gira eternamente. Ver docs/ANDROID_RELEASE.md §2.
//
// Esto NO es hipotetico: la version 7 (2.0.5) se publico asi en Play el 22-10-2026.
// Se compilo en un worktree, donde el archivo no estaba por estar gitignorado, y el
// aviso de abajo era `logger.lifecycle`, que `gradle -q` oculta por completo. Build en
// verde, binario firmado, revision de Google superada, y push imposible para todos.
//
// De ahi las dos decisiones de este bloque:
//   1. En RELEASE se ABORTA. Una app de pagos sin avisos no es una degradacion
//      aceptable, y quien compila casi nunca es quien descubre que faltaba.
//   2. En debug se avisa por `logger.error`, no `lifecycle`: es el unico nivel que
//      sobrevive a `-q`. Un aviso que una bandera puede silenciar no es una barrera.
def servicesJSON = file('google-services.json')
if (servicesJSON.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    gradle.taskGraph.whenReady { graph ->
        def esRelease = graph.allTasks.any { t ->
            t.project == project && t.name ==~ /(?i)(assemble|bundle).*Release.*/
        }
        if (esRelease) {
            throw new GradleException(
                "[alyto] FALTA android/app/google-services.json y esto es una compilacion de RELEASE.\n" +
                "El binario saldria sin configuracion de Firebase y las notificaciones push\n" +
                "no funcionarian en NINGUN dispositivo.\n" +
                "Copia el archivo desde el checkout principal antes de compilar:\n" +
                "  cp <repo>/android/app/google-services.json android/app/\n" +
                "Esta comprobacion existe porque la version 7 se publico sin el."
            )
        }
    }
    logger.error("[alyto] google-services.json ausente: el push nativo NO funcionara en este build (debug).")
}
